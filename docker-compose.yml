services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vmp
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d vmp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/vmp
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Dummy defaults: spring-boot-starter-mail resolves these eagerly at boot
      # regardless of app.mail.enabled, so the container won't start without them.
      # Real sends are best-effort (EmailService swallows failures) — email is
      # non-functional in this local demo unless real SMTP creds are supplied.
      MAIL_HOST: ${MAIL_HOST:-smtp.example.com}
      MAIL_USERNAME: ${MAIL_USERNAME:-demo}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-demo}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8081
      APP_UPLOAD_DIR: /app/uploads
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  pgdata:
  backend_uploads:
