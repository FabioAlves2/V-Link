server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }

    # index.html itself must never be cached — Vite hashes JS/CSS filenames on every build, but
    # index.html's URL never changes, so a cached copy after a redeploy would keep referencing
    # asset filenames that no longer exist on disk.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: client-side routes like /events/3/edit have no matching
    # file on disk, so nginx must serve index.html and let React Router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
